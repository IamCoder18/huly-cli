name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored if version is set)"
        required: false
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
          - none
      version:
        description: "Custom version (e.g. 1.2.3) — overrides bump"
        required: false
        type: string
        default: ""
      tag:
        description: "npm dist-tag (default: latest)"
        required: false
        type: string
        default: "latest"
      dry_run:
        description: "Dry run — bump the version but do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.target }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Determine target version
        id: version
        # Compute the next version in pure bash against the CLI subpackage.
        # `npm version --dry-run` mutates package.json in npm 11.x, so we
        # don't use it.
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./packages/cli/package.json').version")

          bump_semver() {
            local ver="$1" kind="$2"
            local core="${ver%%-+}"
            core="${core#v}"
            local IFS='.'
            read -r major minor patch <<< "$core"
            case "$kind" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump kind: $kind" >&2; return 1 ;;
            esac
            printf '%d.%d.%d' "$major" "$minor" "$patch"
          }

          if [ -n "${{ inputs.version }}" ]; then
            TARGET="${{ inputs.version }}"
            BUMP_KIND="custom"
          elif [ "${{ inputs.bump }}" != "none" ]; then
            TARGET=$(bump_semver "$CURRENT" "${{ inputs.bump }}")
            BUMP_KIND="${{ inputs.bump }}"
          else
            TARGET="$CURRENT"
            BUMP_KIND="none"
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP_KIND" >> "$GITHUB_OUTPUT"

      - name: Bump version in packages/cli/package.json
        if: steps.version.outputs.target != steps.version.outputs.current
        run: |
          set -euo pipefail
          cd packages/cli
          npm version "${{ steps.version.outputs.target }}" --no-git-tag-version --workspaces=false

      - name: Build
        run: pnpm --filter @iamcoder18/huly-cli build

      # The committed `packages/cli/package.json` keeps the
      # `@iamcoder18/huly-cli` name so internal scripts and the monorepo
      # filter keep working.

      - name: Publish @iamcoder18/huly-cli
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pnpm publish --filter @iamcoder18/huly-cli --access public --tag "$TAG" --no-git-checks

      - name: Commit & tag version bump
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.target }}" != "${{ steps.version.outputs.current }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/cli/package.json pnpm-lock.yaml
            git commit -m "chore(release): v${{ steps.version.outputs.target }}"
            git tag "v${{ steps.version.outputs.target }}"
            git push
            git push --tags
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_RESULT: ${{ steps.publish.conclusion }}
        run: |
          {
            echo "### Publish summary"
            echo
            echo "- Previous version: \`${{ steps.version.outputs.current }}\`"
            echo "- Target version:   \`${{ steps.version.outputs.target }}\`"
            echo "- Bump kind:        \`${{ steps.version.outputs.bump }}\`"
            echo "- Tag:              \`${{ inputs.tag }}\`"
            echo "- Dry run:          \`${{ inputs.dry_run }}\`"
            if [ "$DRY_RUN" = "true" ] || [ "$PUBLISH_RESULT" != "success" ]; then
              echo "- Published names:  _none_"
            else
              echo "- Published names:  \`@iamcoder18/huly-cli\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  clawhub:
    name: Publish skill to ClawHub
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Checkout ClawHub CLI source
        uses: actions/checkout@v4
        with:
          repository: openclaw/clawhub
          ref: 82313c2bb17fb8401c41c8ed2b0144d42b461ae7
          path: clawhub-source

      - name: Install ClawHub CLI dependencies
        working-directory: clawhub-source
        run: bun install --frozen-lockfile

      - name: Verify ClawHub token
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN secret is required for ClawHub publishing."
            exit 1
          fi

      - name: Write ClawHub config
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "clawhub-config.json"
          path.write_text(
              json.dumps({"registry": "https://clawhub.ai", "token": os.environ["CLAWHUB_TOKEN"]}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(path)
          PY
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"

      - name: Publish skill to ClawHub
        env:
          TARGET: skills/huly
          OWNER: iamcoder18
          VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          bun clawhub-source/packages/clawhub/src/cli.ts \
            --workdir "$GITHUB_WORKSPACE" \
            --site https://clawhub.ai \
            --registry https://clawhub.ai \
            skill publish "$TARGET" \
            --version "$VERSION" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$RELEASE_SHA" \
            --source-path "$TARGET/SKILL.md" \
            --source-ref "$GITHUB_REF" \
            --owner "$OWNER" \
            --tags "${{ inputs.tag }}" \
            --json | tee clawhub-publish.json

      - name: ClawHub summary
        if: always()
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          {
            echo "### ClawHub summary"
            echo
            echo "- Skill path: \`skills/huly\`"
            echo "- Owner:      \`iamcoder18\`"
            echo "- Version:    \`${{ needs.publish.outputs.version }}\`"
            echo "- Tag:        \`${{ inputs.tag }}\`"
            if [ -s clawhub-publish.json ]; then
              echo
              echo "<details><summary>Publish output</summary>"
              echo
              echo '```json'
              cat clawhub-publish.json
              echo
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"